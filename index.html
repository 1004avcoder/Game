<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D 슈팅 아레나</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <!-- 상단 경험치 바 & 레벨 표시 (심플 & 단색) -->
  <div id="header-ui">
    <div class="level-badge" id="levelDisplay">Lv. 1</div>
    <div class="exp-container">
      <div class="exp-bar-bg">
        <div class="exp-bar-fill" id="expBarFill"></div>
      </div>
      <div class="exp-text" id="expText">0 / 50 EXP</div>
    </div>
  </div>

  <!-- 좌측 하단 Diep.io 스타일 스탯 업그레이드 HUD (포인트 있을 때만 노출) -->
  <div id="stat-hud" class="hidden">
    <div id="statPointsBadge" class="stat-points-badge hidden">
      스탯 포인트: <span id="statPointsCount">0</span>
    </div>
    
    <!-- 1. 최대 체력 -->
    <div class="stat-row" data-stat="hp">
      <button class="stat-btn" id="btn-upgrade-hp" title="[1] 단축키">+</button>
      <span class="stat-key">1</span>
      <span class="stat-label">최대 체력</span>
      <div class="stat-bar-track">
        <div class="stat-bar-fill stat-hp" id="bar-hp"></div>
        <div class="stat-segments">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <span class="stat-val" id="val-hp">0/7</span>
    </div>

    <!-- 2. 방어력 -->
    <div class="stat-row" data-stat="def">
      <button class="stat-btn" id="btn-upgrade-def" title="[2] 단축키">+</button>
      <span class="stat-key">2</span>
      <span class="stat-label">방어력</span>
      <div class="stat-bar-track">
        <div class="stat-bar-fill stat-def" id="bar-def"></div>
        <div class="stat-segments">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <span class="stat-val" id="val-def">0/7</span>
    </div>

    <!-- 3. 공격력 -->
    <div class="stat-row" data-stat="atk">
      <button class="stat-btn" id="btn-upgrade-atk" title="[3] 단축키">+</button>
      <span class="stat-key">3</span>
      <span class="stat-label">공격력</span>
      <div class="stat-bar-track">
        <div class="stat-bar-fill stat-atk" id="bar-atk"></div>
        <div class="stat-segments">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <span class="stat-val" id="val-atk">0/7</span>
    </div>

    <!-- 4. 이동속도 -->
    <div class="stat-row" data-stat="spd">
      <button class="stat-btn" id="btn-upgrade-spd" title="[4] 단축키">+</button>
      <span class="stat-key">4</span>
      <span class="stat-label">이동속도</span>
      <div class="stat-bar-track">
        <div class="stat-bar-fill stat-spd" id="bar-spd"></div>
        <div class="stat-segments">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <span class="stat-val" id="val-spd">0/7</span>
    </div>
  </div>

  <!-- 하단 무기 및 탄약 HUD -->
  <div id="weapon-hud">
    <div class="weapon-info">
      <span class="weapon-name">일반 권총</span>
      <div class="ammo-counter">
        <span id="currentAmmo" class="ammo-num">10</span>
        <span class="ammo-slash">/</span>
        <span id="maxAmmo" class="ammo-max">10</span>
      </div>
    </div>
    <div class="ammo-bar-bg">
      <div id="ammoBarFill" class="ammo-bar-fill"></div>
    </div>
    <div id="reloadHint" class="reload-status hidden">재장전 중... [R]</div>
  </div>

  <!-- 5레벨 주기 무기 진화 모달 선택지 UI (하단 5종 카드) -->
  <div id="evolution-modal" class="hidden">
    <div class="evolution-title">무기 진화 선택 (EVOLUTION)</div>
    <div class="evolution-subtitle">새로운 무기를 선택하세요!</div>
    <div class="evolution-cards" id="evolutionCards">
      <!-- 1. 권총 -->
      <div class="evolution-card" data-weapon="pistol">
        <div class="card-num">1</div>
        <div class="card-icon-wrap">
          <svg class="weapon-svg" viewBox="0 0 64 64">
            <!-- 권총 실루엣 -->
            <path d="M12 24 h28 v12 h-14 l-6 16 h-8 l5 -16 h-5 z" fill="#ffb300" stroke="#222" stroke-width="2"/>
            <rect x="22" y="27" width="16" height="5" fill="#ffe082"/>
            <circle cx="26" cy="38" r="3" fill="#333"/>
          </svg>
        </div>
        <div class="card-name">일반 권총</div>
        <div class="card-desc">안정적인 10발 탄창<br>표준형 단발 권총</div>
      </div>

      <!-- 2. 연발소총 -->
      <div class="evolution-card" data-weapon="rifle">
        <div class="card-num">2</div>
        <div class="card-icon-wrap">
          <svg class="weapon-svg" viewBox="0 0 64 64">
            <!-- 소총 실루엣 -->
            <path d="M8 26 h40 v8 h-6 l-4 18 h-6 l3 -18 h-18 l-5 8 h-6 z" fill="#00e5ff" stroke="#222" stroke-width="2"/>
            <rect x="48" y="28" width="8" height="4" fill="#546e7a"/>
            <rect x="18" y="29" width="18" height="4" fill="#b2ebf2"/>
          </svg>
        </div>
        <div class="card-name">연발소총</div>
        <div class="card-desc">빠른 30발 연사<br>높은 지속 화력</div>
      </div>

      <!-- 3. 샷건 -->
      <div class="evolution-card" data-weapon="shotgun">
        <div class="card-num">3</div>
        <div class="card-icon-wrap">
          <svg class="weapon-svg" viewBox="0 0 64 64">
            <!-- 샷건 실루엣 + 산탄 효과 -->
            <path d="M10 27 h34 v7 h-10 l-4 16 h-8 l4 -16 h-12 l-4 -7 z" fill="#ff5252" stroke="#222" stroke-width="2"/>
            <rect x="44" y="26" width="12" height="9" rx="2" fill="#d32f2f"/>
            <circle cx="58" cy="24" r="2" fill="#ffeb3b"/>
            <circle cx="61" cy="30" r="2.5" fill="#ffeb3b"/>
            <circle cx="58" cy="37" r="2" fill="#ffeb3b"/>
          </svg>
        </div>
        <div class="card-name">샷건</div>
        <div class="card-desc">근거리 6발 펠릿 확산<br>강력한 일격 폭딜</div>
      </div>

      <!-- 4. 저격총 -->
      <div class="evolution-card" data-weapon="sniper">
        <div class="card-num">4</div>
        <div class="card-icon-wrap">
          <svg class="weapon-svg" viewBox="0 0 64 64">
            <!-- 긴 배럴 저격총 실루엣 + 스코프 -->
            <rect x="24" y="18" width="14" height="6" rx="2" fill="#9c27b0"/>
            <circle cx="31" cy="21" r="2" fill="#e1bee7"/>
            <path d="M6 30 h52 v5 h-20 l-4 15 h-7 l3 -15 h-20 z" fill="#ba68c8" stroke="#222" stroke-width="2"/>
            <rect x="54" y="31" width="6" height="3" fill="#e0e0e0"/>
          </svg>
        </div>
        <div class="card-name">저격총</div>
        <div class="card-desc">초고속 & 초대형 관통탄<br>극대화된 단발 피해</div>
      </div>

      <!-- 5. 칼 -->
      <div class="evolution-card" data-weapon="knife">
        <div class="card-num">5</div>
        <div class="card-icon-wrap">
          <svg class="weapon-svg" viewBox="0 0 64 64">
            <!-- 대각선 블레이드 / 대검 실루엣 + 검기 궤적 -->
            <path d="M48 10 L54 16 L26 44 L20 44 L20 38 Z" fill="#00e676" stroke="#222" stroke-width="2"/>
            <path d="M20 44 L14 50 L10 46 L16 40 Z" fill="#795548" stroke="#222" stroke-width="1.5"/>
            <circle cx="12" cy="48" r="2" fill="#ffeb3b"/>
            <path d="M30 14 Q48 24 44 42" stroke="#b9f6ca" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-name">칼 (검기)</div>
        <div class="card-desc">탄약 무제한 근접 베기<br>날카로운 반달 검기 방출</div>
      </div>
    </div>
  </div>

  <!-- 레벨업 알림 팝업 -->
  <div id="levelup-notice" class="hidden">LEVEL UP!</div>

  <script src="game.js"></script>
</body>
</html>
